<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIGL - Loja Orion</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style/style.css}">
</head>

<body>
<div class="navbar-container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-black">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/img/logo.png}" alt="Logo Orion" style="max-height: 100px;">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/}">INICIO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/venda}">VENDAS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pesquisa-produto}">PRODUTOS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pesquisa-membro}">COMUNIDADE</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}" >SAIR</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<main class="conteudo-principal" id="conteudo-dinamico">
    <!-- Conteúdo inicial -->
    <section>
        <div class="container boas-vindas">
            <div class="row justify-content-center">
                <div class="col-sm-12 text-center">
                    <h1 class="display-6"><strong>Sistema Integrado de Gestão de Loja</strong></h1>
                    <p class="texto-uso">
                        Este é o seu painel de controle para o universo da Orion...
                    </p>
                    <img th:src="@{/img/fundo.png}" alt="arte-orion">
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="rodape">
    <div class="container py-2 rodape">
        <div class="my-0 row align-items-center">
            <div class="col-sm-12 text-center">
                <p class="mb-0 texto-rodape">&copy; 2025 - Todos os direitos reservados.</p>
            </div>
        </div>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script th:src="@{/script/script.js}"></script>
<script th:src="@{/script/cadastroFormParceiro.js}"></script>
<script th:src="@{/script/cadastroFormProduto.js}"></script>
<script th:src="@{/script/formVendas.js}"></script>
<script th:src="@{/script/pesquisaProduto.js}"></script>
<script th:src="@{/script/consultaVendas.js}"></script>
<script th:src="@{/script/consultaAvancadaProdutos.js}"></script>

</body>
</html>

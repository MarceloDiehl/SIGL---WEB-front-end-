<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar – SIGL Orion</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style/style.css}">
</head>
<body>
<div class="login-pagina">

    <section class="login-marca">
        <p class="titulo-sistema">Sistema Integrado de Gestão de Loja</p>
        <img th:src="@{/img/logo.png}" alt="Logo Orion Record Store">
        <p class="slogan">Do balcão ao estoque, <em>no mesmo compasso</em>.</p>
        <div class="vinil" aria-hidden="true">
            <svg class="vinil-selo" viewBox="0 0 300 300" aria-hidden="true">
                <defs><path id="arco-selo" d="M 32 150 a 118 118 0 1 1 236 0 a 118 118 0 1 1 -236 0"/></defs>
                <circle cx="150" cy="150" r="148" fill="#c2410c"/>
                <circle cx="150" cy="150" r="140" fill="none" stroke="#fff" stroke-opacity=".25"/>
                <text font-family="Bricolage Grotesque, Inter, sans-serif" font-size="19" font-weight="700" letter-spacing="7" fill="#fff" fill-opacity=".85">
                    <textPath href="#arco-selo">ORION RECORD STORE · LADO A · STEREO ·</textPath>
                </text>
                <text x="150" y="132" text-anchor="middle" font-family="Bricolage Grotesque, Inter, sans-serif" font-size="34" font-weight="700" letter-spacing="6" fill="#fff">ORION</text>
                <text x="150" y="196" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#fff" fill-opacity=".85">SIGL</text>
                <circle cx="150" cy="150" r="9" fill="#17161a"/>
            </svg>
        </div>
        <p class="rodape-login">&copy; 2026 Orion Record Store&trade;</p>
    </section>

    <main class="login-form-area">
        <!-- POST /login é tratado pelo Spring Security (SegurancaConfig); th:action inclui o token CSRF -->
        <form th:action="@{/login}" method="post" class="formulario-login" id="formulario-login" novalidate>
            <div class="mb-4">
                <h1>Entrar</h1>
                <p class="texto-suave mb-0">Use o e-mail e senha cadastrados.</p>
            </div>

            <!-- Mensagens conforme o parâmetro da URL: ?erro (login recusado), ?saiu (logout), ?expirou (sessão) -->
            <div th:if="${param.erro}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-exclamation-circle"></i>
                <span>E-mail ou senha inválidos.</span>
            </div>
            <div th:if="${param.saiu}" class="alert alert-success d-flex align-items-center gap-2" role="status">
                <i class="bi bi-check-circle"></i>
                <span>Você saiu do sistema.</span>
            </div>
            <div th:if="${param.expirou}" class="alert alert-warning d-flex align-items-center gap-2" role="status">
                <i class="bi bi-clock-history"></i>
                <span>Sua sessão expirou. Entre de novo para continuar.</span>
            </div>
            <div class="mb-3">
                <label for="login_email" class="form-label">E-mail</label>
                <input type="email" id="login_email" name="login-email" class="form-control"
                       autocomplete="username" placeholder="voce@orion.com.br" autofocus>
            </div>

            <div class="mb-3">
                <label for="login_senha" class="form-label">Senha</label>
                <input type="password" id="login_senha" name="login-senha" class="form-control"
                       autocomplete="current-password">
            </div>

            <div class="d-grid mt-4">
                <button type="submit" id="btn-login" class="btn btn-primary btn-lg">Entrar</button>
            </div>
        </form>
    </main>
</div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.js"></script>
<script th:src="@{/script/login.js}"></script>
</body>
</html>

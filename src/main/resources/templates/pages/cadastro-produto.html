
<div class="container cadastro-produto" xmlns:th="http://www.w3.org/1999/xhtml">

    <div class="row justify-content-center align-items-center">
        <div class="mb-3">
            <h3 class="titulo-paginas display-6">Cadastro de Produtos</h3>
        </div>
    </div>

    <form action="#" method="post" class="formulario-produto mt-4" id="formulario-produto">
        <div class="row">
            <div class="my-2 col-sm-12">
                <p><strong>PREENCHA OS DADOS DO PRODUTO:</strong></p>
            </div>
            <div class="my-2 col-sm-12">
                <label for="titulo-produto" class="form-label">Titulo do Produto</label>
                <input type="text" id="titulo-produto" name="titulo-produto" class="form-control" />
            </div>
            <div class="my-2 col-sm-12">
                <div class="row">
                    <div class="col-sm-8">
                        <label for="descricao-produto" class="form-label">Descrição</label>
                        <textarea id="descricao-produto" name="descricao-produto" class="form-control"
                                  rows="16"></textarea>
                    </div>
                    <div class="col-sm-4">
                        <div class="row">
                            <div class="col-sm-12">
                                <label for="valor-produto" class="form-label">Valor unitário</label>
                                <input type="text" id="valor-produto" name="valor-produto" class="form-control" />
                            </div>
                            <div class="col-sm-12">
                                <label for="quantidade-produto" class="form-label">Quantidade</label>
                                <input type="text" id="quantidade-produto" name="quantidade-produto"
                                       class="form-control" />
                            </div>
                            <div class="col-sm-12">
                                <label for="tipo-produto" class="form-label">Tipo de Produto</label>
                                <select class="form-select" id="tipo-produto" name="tipo">
                                    <option selected disabled value="">Selecione uma opção</option>
                                    <option value="disco">Disco de Vinil</option>
                                    <option value="cd">CD - Compact Disc</option>
                                    <option value="papelaria">Artigos de Papelaria</option>
                                    <option value="livros">Livros</option>
                                    <option value="moda">Moda e Vestuário</option>
                                    <option value="equipamentos">Equipamentos Eletrônicos</option>
                                    <option value="instrumentos">Instrumentos Musicais</option>
                                    <option value="raridades">Raridades</option>
                                </select>
                            </div>
                            <div class="col-sm-12">
                                <div class="col-sm-12">
                                    <label for="condicao-produto" class="form-label">Condição</label>
                                    <select class="form-select" id="condicao-produto" name="condicao">
                                        <option selected disabled value="">Selecione uma opção</option>
                                        <option value="novo">Produto Novo</option>
                                        <option value="usado-otimo">Usado (Ótimo)</option>
                                        <option value="usado-bom">Usado (Bom)</option>
                                        <option value="usado-marcas-uso">Usado (Marcas de Uso)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-sm-12">
                                <label for="data-produto" class="form-label">Data de Inclusão</label>
                                <input type="date" id="data-produto" name="data-produto" class="form-control" />
                            </div>
                            <div class="col-sm-12">
                                <label for="codigo-produto" class="form-label">Código do Produto</label>
                                <input type="text" id="codigo-produto" name="codigo-produto" class="form-control" />
                            </div>
                        </div>
                    </div>

                </div>

            </div>
            <div id="mensagem-feedback" class="mt-3"></div>

            <div class="row justify-content-between align-items-center">
                <div class="col-auto">
                    <div class="d-grid">
                        <a class="btn btn-danger px-4" th:href="@{/pesquisa-avancada}"
                           id="voltar-pesquisa-avancada">Voltar</a>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="d-flex gap-2">
                        <button type="button" id="limpar-cadastro-produto"
                                class="btn btn-secondary px-4">Limpar</button>
                        <button type="submit" id="enviar-cadastro-produto" class="btn btn-primary px-4">Salvar</button>
                    </div>
                </div>
            </div>
        </div>

    </form>
</div>

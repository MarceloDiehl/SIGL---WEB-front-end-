<div class="cadastro-produto">

    <header class="pagina-cabecalho">
        <div>
            <p class="pagina-sobretitulo">Catálogo</p>
            <h1 class="pagina-titulo">Cadastrar produto</h1>
            <p class="pagina-descricao">Todos os campos são obrigatórios; o código tem 6 caracteres e não pode se repetir.</p>
        </div>
    </header>

    <form action="#" method="post" class="formulario-produto" id="formulario-produto" novalidate>
        <div class="row g-3">

            <!-- Identificação -->
            <div class="col-lg-7">
                <section class="painel h-100">
                    <div class="painel-cabecalho">
                        <h2 class="painel-titulo">Identificação</h2>
                    </div>
                    <div class="painel-corpo">
                        <div class="row g-3">
                            <div class="col-sm-4">
                                <label for="codigo-produto" class="form-label">Código</label>
                                <input type="text" id="codigo-produto" name="codigo-produto" class="form-control codigo"
                                       maxlength="6" placeholder="000000" autocomplete="off" />
                            </div>
                            <div class="col-sm-8">
                                <label for="titulo-produto" class="form-label">Título</label>
                                <input type="text" id="titulo-produto" name="titulo-produto" class="form-control"
                                       maxlength="70" placeholder="Ex.: Pink Floyd – The Dark Side of the Moon (LP)" />
                            </div>
                            <div class="col-12">
                                <label for="descricao-produto" class="form-label">Descrição</label>
                                <textarea id="descricao-produto" name="descricao-produto" class="form-control"
                                          rows="7" maxlength="255"
                                          placeholder="Edição, prensagem, estado da capa e do encarte, observações..."></textarea>
                                <div class="contador-caracteres num"><span id="descricao-contador">0</span>/255</div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Estoque e preço -->
            <div class="col-lg-5">
                <section class="painel h-100">
                    <div class="painel-cabecalho">
                        <h2 class="painel-titulo">Classificação, estoque e preço</h2>
                    </div>
                    <div class="painel-corpo">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="tipo-produto" class="form-label">Tipo de produto</label>
                                <select class="form-select" id="tipo-produto" name="tipo">
                                    <option selected disabled value="">Selecione...</option>
                                    <option value="disco">Disco de Vinil</option>
                                    <option value="cd">CD - Compact Disc</option>
                                    <option value="papelaria">Artigos de Papelaria</option>
                                    <option value="livros">Livros</option>
                                    <option value="moda">Moda e Vestuário</option>
                                    <option value="equipamentos">Equipamentos Eletrônicos</option>
                                    <option value="instrumentos">Instrumentos Musicais</option>
                                    <option value="raridades">Raridades</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label for="condicao-produto" class="form-label">Condição</label>
                                <select class="form-select" id="condicao-produto" name="condicao">
                                    <option selected disabled value="">Selecione...</option>
                                    <option value="novo">Produto Novo</option>
                                    <option value="usado-otimo">Usado (Ótimo)</option>
                                    <option value="usado-bom">Usado (Bom)</option>
                                    <option value="usado-marcas-uso">Usado (Marcas de Uso)</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label for="valor-produto" class="form-label">Valor unitário (R$)</label>
                                <input type="text" id="valor-produto" name="valor-produto" class="form-control num"
                                       inputmode="decimal" placeholder="0.00" />
                            </div>
                            <div class="col-sm-6">
                                <label for="quantidade-produto" class="form-label">Quantidade</label>
                                <input type="text" id="quantidade-produto" name="quantidade-produto" class="form-control num"
                                       inputmode="numeric" placeholder="0" />
                            </div>
                            <div class="col-12">
                                <label for="data-produto" class="form-label">Data de inclusão</label>
                                <input type="date" id="data-produto" name="data-produto" class="form-control" />
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <div id="mensagem-feedback" class="mt-3"></div>

        <div class="acoes-form">
            <a class="btn btn-light" href="/pesquisa-avancada" id="voltar-pesquisa-avancada">
                <i class="bi bi-arrow-left"></i>Voltar ao estoque
            </a>
            <div class="grupo">
                <button type="button" id="limpar-cadastro-produto" class="btn btn-texto">Limpar</button>
                <button type="submit" id="enviar-cadastro-produto" class="btn btn-primary">
                    <i class="bi bi-check2"></i>Salvar produto
                </button>
            </div>
        </div>
    </form>
</div>

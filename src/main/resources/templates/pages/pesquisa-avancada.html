<div class="container busca-avancada" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="row justify-content-center align-items-center">
        <div class="mb-3">
            <h3 class="titulo-paginas display-6">Pesquisa avançada de produtos</h3>
        </div>
    </div>

    <form action="#" method="post" class="formulario-produto mt-4">
        <div class="row">
            <div class="col-sm-4 mb-3">
                <input type="text" id="cod_pesquisa" name="cod_pesquisa" class="form-control"
                       placeholder="Filtre pelo Código do Produto"/>
            </div>
            <div class="col-12 mb-3">
                <div class="table-responsive overflow-y-auto" style="max-height: 400px;">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th scope="col">Cód.</th>
                            <th scope="col">Descrição</th>
                            <th scope="col">Qtd</th>
                            <th scope="col">Valor Unitário</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Condição</th>
                            <th scope="col">Observação</th>
                            <th scope="col">Data de Entrada</th>
                        </tr>
                        </thead>
                        <tbody id="tabela-produtos-body">
                        <tr>
                            <td colspan="8" class="text-center">Carregando produtos...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-12">
                <div class="row justify-content-between align-items-center">
                    <div class="col-auto">
                        <div class="d-flex gap-2">
                            <button type="button" id="excluir_produto" class="btn btn-danger px-4" disabled>Excluir</button>
                            <button type="button" id="atualizar_produto" class="btn btn-secondary px-4" disabled>Atualizar</button>
                        </div>
                    </div>
                    <div class="col-auto">
                        <a class="btn btn-primary px-4" th:href="@{/cadastro-produto}" id="cadastrar_membro">Cadastrar</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<!-- Modal Atualizar Produto -->
<div class="modal fade" id="modalAtualizarProduto" tabindex="-1" aria-labelledby="modalAtualizarProdutoLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formAtualizarProduto">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalAtualizarProdutoLabel">Atualizar Produto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <!-- Input escondido para código -->
                    <input type="hidden" id="codigo-produto-modal">

                    <div class="mb-3">
                        <label for="quantidade-modal" class="form-label">Quantidade</label>
                        <input type="number" class="form-control" id="quantidade-modal" required>
                    </div>
                    <div class="mb-3">
                        <label for="valor-modal" class="form-label">Valor Unitário (R$)</label>
                        <input type="text" class="form-control" id="valor-modal" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Atualizar</button>
                </div>
            </form>
        </div>
    </div>
</div>

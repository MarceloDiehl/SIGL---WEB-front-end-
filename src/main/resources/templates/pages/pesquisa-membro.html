<div class="container parceiros-cadastrados" xmlns:th="http://www.w3.org/1999/xhtml">

    <div class="row justify-content-center align-items-center">
        <div class="mb-3">
            <h3 class="titulo-paginas display-6 text-start">Parceiros cadastrados</h3>
        </div>
    </div>

    <form action="#" method="post" class="formulario-parceiros mt-4">
        <div class="row">
            <div class="col-sm-6 mb-3">
                <input type="text" id="cpf_pesquisa" name="cpf_pesquisa" class="form-control"
                       placeholder="Filtre pelo CPF"/>
            </div>

            <div class="col-sm-12">
                <div class="table-responsive overflow-y-auto shadow-sm rounded" style="max-height: 400px;">
                    <table class="table table-striped table-bordered align-middle">
                        <thead class="table table-striped">
                        <tr>
                            <th>Nome</th>
                            <th>Sobrenome</th>
                            <th>Data de Nascimento</th>
                            <th>ID Cargo</th>
                            <th>ID Escolaridade</th>
                            <th>Especialidade</th>
                            <th>Telefone</th>
                            <th>CPF</th>
                            <th>ID Gênero</th>
                            <th>Endereço</th>
                            <th>Número</th>
                            <th>Bairro</th>
                            <th>Cidade</th>
                            <th>UF</th>
                            <th>CEP</th>
                            <th>Contato Emergência</th>
                            <th>Data de Admissão</th>
                            <th>RG</th>
                            <th>CTPAS</th>
                            <th>E-mail</th>
                        </tr>
                        </thead>
                        <tbody id="tabela-membros-body">
                        <tr>
                            <td colspan="20" class="text-center">Carregando membros...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </form>

    <div class="col-sm-12 mt-3">
        <div class="row justify-content-between align-items-center">
            <div class="col-auto">
                <button type="button" id="excluir_membro" class="btn btn-danger px-4" disabled>Excluir</button>
            </div>
            <div class="col-auto d-flex gap-2">
                <a th:href="@{/cadastro-membro}" id="cadastrar_membro" class="btn btn-primary px-4">Cadastrar</a>
            </div>
        </div>
    </div>
</div>

<div class="parceiros-cadastrados">

    <header class="pagina-cabecalho">
        <div>
            <p class="pagina-sobretitulo">Pessoas</p>
            <h1 class="pagina-titulo">Comunidade</h1>
            <p class="pagina-descricao">Clientes e funcionários cadastrados; clique em uma pessoa para ver os dados.</p>
        </div>
        <div class="pagina-acoes">
            <a href="/cadastro-membro" id="cadastrar_membro" class="btn btn-primary">
                <i class="bi bi-person-plus"></i>Cadastrar membro
            </a>
        </div>
    </header>

    <section class="painel painel-lista painel-lista-curta">
        <form action="#" method="post" class="barra-ferramentas formulario-parceiros" onsubmit="return false;">
            <div class="busca">
                <i class="bi bi-search"></i>
                <label for="cpf_pesquisa" class="visually-hidden">Filtrar pelo CPF</label>
                <input type="text" id="cpf_pesquisa" name="cpf_pesquisa" class="form-control"
                       placeholder="Filtrar pelo CPF" autocomplete="off" />
            </div>
            <div class="acoes">
                <span class="contador num align-self-center me-2" id="resumo-membros"></span>
                <button type="button" id="excluir_membro" class="btn btn-perigo" disabled>
                    <i class="bi bi-trash3"></i>Excluir
                </button>
            </div>
        </form>

        <div class="tabela-wrap">
            <table class="table tabela">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Cidade</th>
                    <th>Desde</th>
                </tr>
                </thead>
                <tbody id="tabela-membros-body" class="num">
                <tr><td colspan="6">Carregando membros...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="painel detalhes-membro" id="detalhes-membro">
        <div class="vazio">
            <i class="bi bi-person-vcard"></i>
            Selecione uma pessoa na lista para ver os detalhes.
        </div>
    </section>
</div>

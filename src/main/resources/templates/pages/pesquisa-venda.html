<div class="pesquisa-venda">

    <header class="pagina-cabecalho">
        <div>
            <p class="pagina-sobretitulo">Vendas</p>
            <h1 class="pagina-titulo">Histórico de vendas</h1>
            <p class="pagina-descricao">Cada linha é um item vendido; filtre pelo código do produto.</p>
        </div>
    </header>

    <section class="painel painel-lista">
        <form action="#" method="post" class="barra-ferramentas" onsubmit="return false;">
            <div class="busca">
                <i class="bi bi-search"></i>
                <label for="cod-pesquisa-venda" class="visually-hidden">Filtrar por código do produto</label>
                <input type="text" id="cod-pesquisa-venda" name="cod-pesquisa-venda" class="form-control"
                       placeholder="Filtrar por código do produto" autocomplete="off" />
            </div>
            <span class="contador num" id="resumo-vendas"></span>
        </form>

        <div class="tabela-wrap">
            <table class="table tabela" id="tabela-vendas">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Código</th>
                    <th>Título</th>
                    <th class="text-end">Valor unit.</th>
                    <th class="text-end">Qtd</th>
                    <th class="text-end">Total</th>
                    <th>Data</th>
                    <th>Vendedor</th>
                    <th>CPF cliente</th>
                    <th>Pagamento</th>
                </tr>
                </thead>
                <tbody id="tabela-vendas-body" class="num">
                <tr><td colspan="10">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<div class="container pesquisa-venda" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="row justify-content-center align-items-center">
        <div class="mb-3">
            <h3 class="titulo-paginas display-6">Pesquisar vendas efetuadas</h3>
        </div>
    </div>
    <form action="#" method="post" class="formulario-parceiros mt-4">
        <div class="row g-3">
            <div class="col-sm-4">
                <input type="text" id="cod-pesquisa-venda" name="cod-pesquisa-venda" class="form-control"
                    placeholder="Filtrar por Código do produto" />
            </div>
            <div class="col-sm-12">
                <div class="table-responsive overflow-y-auto shadow-sm rounded" style="max-height: 400px;">
                    <table class="table table-striped table-bordered align-middle" id="tabela-vendas">
                        <thead class="table table-striped">
                            <tr>
                                <th>ID</th>
                                <th>Código do Produto</th>
                                <th>Título</th>
                                <th>Valor Unitário</th>
                                <th>Quantidade</th>
                                <th>Valor Total</th>
                                <th>Data da Venda</th>
                                <th>ID Vendedor</th>
                                <th>CPF Cliente</th>
                                <th>ID Método Pagamento</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-vendas-body">
                        <tr>
                            <td colspan="10" class="text-center">Carregando...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-sm-12">
                <div class="row justify-content-between align-items-center">
                    <div class="col-auto">
                        <a th:href="@{/venda}"  class="btn btn-danger px-4"> Voltar</a>
                    </div>
                </div>
            </div>

        </div>
    </form>
</div>

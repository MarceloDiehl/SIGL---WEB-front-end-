<div class="container vendas" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="row justify-content-center align-items-center">
        <div class="mb-3">
            <h3 class="titulo-paginas display-6">Controle de Vendas</h3>
        </div>
    </div>

    <form action="#" method="get" id="formulario-venda-produto">
        <div class="row">
            <div class="col-sm-3">
                <div class="mb-3"><label for="cod-produto-venda" class="form-label">Cód. Produto</label>
                    <input type="text" id="cod-produto-venda" name="cod-produto-estoque" class="form-control" />
                </div>
                <div class="mb-3">
                    <label for="qtd-produto-venda" class="form-label">Quantidade</label>
                    <input type="number" id="qtd-produto-venda" name="qtd-produto-estoque" class="form-control" min="1" />
                </div>
                <div class="mb-3">
                    <label for="itens-lista-compras" class="form-label">Ítens na lista</label>
                    <input type="text" id="itens-lista-compras" name="itens-lista-compras" class="form-control"
                           readonly value="0" /> </div>
                <div class="mb-3">
                    <div class="d-grid">
                        <button type="submit" class="btn btn-secondary" id="btn-produto-lista">Incluir Produto à
                            Lista</button>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="d-grid">
                        <a th:href="@{/pesquisa-venda}"  class="btn btn-secondary">Pesquisar Vendas Realizadas</a>
                    </div>
                </div>

            </div>
            <div class="col-sm-9">
                <div class="row mb-3">
                    <div class="col-sm-3">
                        <label for="codigo-produto-display" class="form-label">Código</label>
                        <input type="text" id="codigo-produto-display" name="cod-produto-display" class="form-control"
                               readonly />
                    </div>
                    <div class="col-sm-9">
                        <label for="descricao-produto-display" class="form-label">Descrição</label>
                        <input type="text" id="descricao-produto-display" name="descricao-produto-display"
                               class="form-control" readonly />
                    </div>
                </div>
                <div class="col-sm-12">
                    <table class="table table-striped" id="tabela-itens-venda">
                        <thead>
                        <tr>
                            <th scope="col">Posição</th> <th scope="col">Cód. Produto</th>
                            <th scope="col">Titulo</th>
                            <th scope="col">Valor Unitário</th>
                            <th scope="col">Quantidade</th>
                            <th scope="col">Sub-total</th>
                        </tr>
                        </thead>
                        <tbody id="tabela-itens-venda-body">
                        <tr><td colspan="6" class="text-center">Nenhum item na lista</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-end">
                    <p class="valor-produto" style="font-size: 30px;" id="valor-total-display">
                        <strong>Valor Total: R$0,00</strong>
                    </p>
                </div>

            </div>
        </div>
    </form>
    <div class="row">
        <div class="col-sm-4"></div>
        <div class="col-sm-8">
            <div class="row">
                <div class="col-sm-3">
                    <div class="d-grid">
                        <button type="button" class="btn btn-danger" id="btn-remover-item">Excluir item</button>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="d-grid"><button type="button" id="limpar-lista-venda" class="btn btn-secondary">Limpar Lista</button>
                    </div>
                </div>
                <div class="col-sm-6 gap-2">
                    <div class="d-grid">
                        <button type="button" class="btn btn-primary" id="btn-avancar-venda"
                                data-bs-toggle="modal" data-bs-target="#modal-concluir-venda" disabled>Avançar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modal-concluir-venda" tabindex="-1" aria-labelledby="concluir-venda-label"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="concluir-venda-label"><strong>Conclusão de Venda</strong></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-sm-12">
                            <label for="cpf-cliente-conclusao" class="form-label">CPF Cliente</label>
                            <input type="text" id="cpf-cliente-conclusao" name="cpf-cliente-conclusao"
                                   class="form-control" />
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4">
                            <label for="cod-vendedor-conclusao" class="form-label">Cód. Vendedor</label>
                            <input type="text" id="cod-vendedor-conclusao" name="cod-vendedor-conclusao"
                                   class="form-control" />
                        </div>
                        <div class="col-sm-4">
                            <label for="data-conclusao" class="form-label">Data</label>
                            <input type="date" id="data-conclusao" name="data-conclusao" class="form-control" />
                        </div>
                        <div class="col-sm-4">
                            <label for="valor-total-conclusao-venda" class="form-label">Valor Total:</label>
                            <input type="text" id="valor-total-conclusao-venda" name="valor-total-conclusao"
                                   class="form-control" readonly />
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary" id="btn-avancar-pagamento"
                            data-bs-toggle="modal" data-bs-target="#modal-pagamento-venda">Avançar</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modal-pagamento-venda" tabindex="-1" aria-labelledby="pagamento-venda-label"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="pagamento-venda-label"><strong>Forma de Pagamento</strong></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row justify-content-center align-items-center">
                        <div class="col-sm-6 " style="margin-top: 30px;">
                            <div class="form-check">
                                <input type="radio" id="pagamento-dinheiro" name="forma-pagamento" value="1"
                                       class="form-check-input" checked>
                                <label for="pagamento-dinheiro"
                                       class="form-check-label"><strong>Dinheiro</strong></label>
                            </div>
                            <div class="form-check">
                                <input type="radio" id="pagamento-credito" name="forma-pagamento" value="2"
                                       class="form-check-input">
                                <label for="pagamento-credito" class="form-check-label"><strong>Crédito</strong></label>
                            </div>
                            <div class="form-check">
                                <input type="radio" id="pagamento-debito" name="forma-pagamento" value="3"
                                       class="form-check-input">
                                <label for="pagamento-debito" class="form-check-label"><strong>Débito</strong></label>
                            </div>
                            <div class="form-check">
                                <input type="radio" id="pagamento-pix" name="forma-pagamento" value="4"
                                       class="form-check-input">
                                <label for="pagamento-pix" class="form-check-label"><strong>PIX</strong></label>
                            </div>
                            <label for="valor-total-pagamento" class="form-label mt-3"><strong>Valor
                                Total:</strong></label>
                            <input type="text" id="valor-total-pagamento" name="valor-total-conclusao"
                                   class="form-control" readonly />
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary" id="btn-concluir-venda"
                            data-bs-toggle="modal" data-bs-target="#modal-pagamento-finalizado">Concluir</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modal-pagamento-finalizado" tabindex="-1" aria-labelledby="pagamento-venda-finalizado"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="pagamento-venda-finalizado-label"><strong>Status</strong></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row justify-content-center align-items-center">
                        <div class="col-sm-12 text-center">
                            <h3><strong>Pagamento Finalizado!</strong></h3>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>

                </div>
            </div>
        </div>
    </div>
</div>

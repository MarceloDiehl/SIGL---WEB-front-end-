# Perfil "test": banco H2 em memória, criado pelas mesmas migrações do Flyway (modo MySQL).
# O mvn test não depende do MySQL local e roda em qualquer máquina e em CI.
spring.datasource.url=jdbc:h2:mem:sigl;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Confere se as entidades batem com as tabelas criadas pelas migrações
spring.jpa.hibernate.ddl-auto=validate
# Mesmas migrações + callback de compatibilidade do H2 (db/h2/beforeMigrate.sql)
spring.flyway.locations=classpath:db/migration,classpath:db/h2
